<!-- ============================================================
     ΕΔΩ ΠΡΟΣΘΕΤΕΤΕ ΚΑΘΕ ΝΕΟ ΚΕΙΜΕΝΟ.
     Αντιγράψτε ένα μπλοκ { ... }, βάλτε το ΠΑΝΩ-ΠΑΝΩ (το πιο
     πρόσφατο πρώτο) και συμπληρώστε τα πεδία:
       kind   : τι είναι (π.χ. "Διήγημα", "Ποίημα", "Δοκίμιο")
       title  : ο τίτλος
       blurb  : μία-δύο αράδες περιγραφή (προαιρετικό)
       note   : μικρή σημείωση, π.χ. συλλογή/εκδόσεις (προαιρετικό)
       minutes: χρόνος ανάγνωσης σε λεπτά (προαιρετικό, βάλτε 0 για να μη φαίνεται)
       href   : το αρχείο της σελίδας, π.χ. "texts/xlorini.html"
     ============================================================ -->
<script>
  const TEXTS = [
    {
      kind: "Διήγημα",
      title: "Η ανάκληση του αυτοκρατορικού πάντα",
      blurb: "Η Κίνα δανείζει πάντα ως δείγμα διπλωματικής ευγνωμοσύνης, ένα κωλόχοντρο πάντα εθισμένο στην προβατίνα κι ένα παλαιοντολογικό μουσείο μαμούθ στη Μηλιά Γρεβενών με στατιστική καταλληλότητα στέγασης πάντα 1.1856/10.",
      note: "Από τη συλλογή <em>Ιστορίες με άχρηστα διαγράμματα και βαριά στατιστική ελαφρότητα</em>",

      href: "texts/panta.html"

    {

      blurb: "Ένας καθηγητής κλέβει ρεύμα του πανεπιστημίου για να φορτίζει το ηλεκτρικό του παρκαρισμένο κάτω από μια καρυδιά, ένα νομοσχέδιο, μια υπουργός, κι ένα τέρας υπολογιστή ονόματι Γιάννης.",
      note: "Το τελευταίο κεφάλαιο από το μυθιστόρημα <em>Γκρόβερ 2: Η υποσημείωση</em> (σίκουελ του «Γκρόβερ»), εκδόσεις Δίαυλος",
      minutes: 68,
      cover: "covers/grover2.jpg",
      href: "texts/grover2.html"
    },
    {
      kind: "Μυθιστόρημα · απόσπασμα",
      title: "Μην μιλάς, δεν είναι απαρέμφατο",
      blurb: "Ταμπουρωμένοι στη Φιλοσοφική μετά από μια γλωσσική επίθεση, μια ΝΑΕ που ξαναγράφει την ιστορία, γλωσσικές ταξιαρχίες, ένα σάιτ στην Τουβαλού, κι ένας Χατζηκυριακίδης που γελάει μόνος του.",
      note: "Απόσπασμα (κεφάλαιο 7) από το μυθιστόρημα <em>Μην μιλάς, δεν είναι απαρέμφατο</em>, εκδόσεις Δίαυλος",
      minutes: 46,
      cover: "covers/minmilas.jpg",
      href: "texts/tritoklitoi.html"
    },
    {
      kind: "Μυθιστόρημα · απόσπασμα",
      title: "Σκαλωμένοι σε ένα μπαρ",
      blurb: "Καφές, ένα γατί μεταναλυτικός φιλόσοφος, μια παρέλαση που την αποφεύγεις με σλάλομ, και τριάντα χρόνια δρόμος.",
      note: "Απόσπασμα από το ομώνυμο μυθιστόρημα, εκδόσεις Δίαυλος",
      minutes: 12,
      cover: "covers/skalomenoi.jpg",
      href: "texts/skalomenoi.html"
    },
    {
      kind: "Μυθιστόρημα · απόσπασμα",
      title: "Γκρόβερ",
      blurb: "Τρεις αυτόκλητοι διερμηνείς σε ένα φιλελέ συνέδριο στο Λονδίνο, ένας παλιός γνωστός με κόμπλεξ μεγαλείου, και κέτσαπ αντί για αίμα.",
      note: "Απόσπασμα (κεφάλαιο 6) από το μυθιστόρημα <em>Γκρόβερ</em>, εκδόσεις Δίαυλος",
      minutes: 24,
      cover: "covers/grover.jpg",
      href: "texts/grover.html"
    },
    {
      kind: "Διήγημα",
      title: "Ισούζου είναι!",
      blurb: "Ένα ετοιμοθάνατο Ισούζου, ένα Όπελ μεταμφιεσμένο, κι ένας Πόντιος που αρνείται τη σκληρή αντικειμενική πραγματικότητα.",
      note: "Από τη συλλογή <em>Βατσ’νιές</em>, εκδόσεις Δίαυλος",
      minutes: 19,
      cover: "covers/vatsnies.jpeg",
      href: "texts/isouzou.html"
    },
    {
      kind: "Διήγημα",
      title: "Χλωρίνη δώδεκα κιλά",
      blurb: "Μια κόρη, μια μάνα που δεν λιώνει, και η Αλγεβρική Τοπολογία ως μέθοδος πένθους.",
      note: "Από τη συλλογή <em>Ιστορίες Απλής Λογικής και Λίγης Θλίψης</em>, εκδόσεις Νήσος",
      minutes: 14,
      cover: "covers/logikis.jpg",  // εξώφυλλο της συλλογής (στο covers/) — αν λείπει, απλώς δεν φαίνεται
      href: "texts/xlorini.html"
    }
    // ,{
    //   kind: "Ποίημα",
    //   title: "Ο τίτλος του επόμενου κειμένου",
    //   blurb: "",
    //   note: "",
    //   minutes: 0,
    //   cover: "covers/allo-keimeno.jpg",
    //   href: "texts/allo-keimeno.html"
    // }
  ];

  (function () {
    var list = document.getElementById('texts-list');
    if (!TEXTS.length) {
      list.innerHTML = '<li class="empty">Σύντομα κι άλλα κείμενα…</li>';
    } else {
      list.innerHTML = TEXTS.map(function (t) {
        var foot = [];
        if (t.minutes) foot.push('περίπου ' + t.minutes + ' λεπτά ανάγνωσης');
        if (t.note) foot.push(t.note);
        var cover = t.cover
          ? '<img class="tc-cover" src="' + t.cover + '" alt="Εξώφυλλο" loading="lazy" onerror="this.remove()">'
          : '';
        return '<li><a class="text-card" href="' + t.href + '">'
          + cover
          + '<span class="tc-body">'
          + (t.kind ? '<span class="tc-kind">' + t.kind + '</span>' : '')
          + '<h2>' + t.title + '</h2>'
          + (t.blurb ? '<p class="tc-blurb">' + t.blurb + '</p>' : '')
          + (foot.length ? '<p class="tc-foot">' + foot.join(' · ') + '</p>' : '')
          + '</span></a></li>';
      }).join('');
    }
  })();
</script>
<script src="assets/reader.js"></script>
